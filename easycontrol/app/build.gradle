plugins {
    id 'com.android.application'
}

android {
    namespace 'top.saymzx.easycontrol.app'
    compileSdk 35
    defaultConfig {
        applicationId "io.github.chillibeaver.padkite"
        minSdk 23
        targetSdk 34
        versionCode 10702
        versionName "1.7.2"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }
    viewBinding {
        enabled = true
    }
    // 密钥不在仓库里：没有 doc/release.jks 时 release 不签名（F-Droid 用自己的密钥签）
    def releaseKey = file("doc/release.jks")
    signingConfigs {
        if (releaseKey.exists()) {
            debug {
                storeFile releaseKey
                storePassword "123456"
                keyAlias "test"
                keyPassword "123456"
            }
            release {
                storeFile releaseKey
                storePassword "123456"
                keyAlias "test"
                keyPassword "123456"
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug" //包名后缀
            buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "true"
            manifestPlaceholders = [app_name: "@string/app_name_dev", app_icon: "@mipmap/ic_launcher", app_icon_round: "@mipmap/ic_launcher_round"]
            debuggable true
        }
        release {
            if (releaseKey.exists()) signingConfig signingConfigs.release
            buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "false"
            manifestPlaceholders = [app_name: "@string/app_name", app_icon: "@mipmap/ic_launcher", app_icon_round: "@mipmap/ic_launcher_round"]
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }

    buildFeatures {
        buildConfig = true
    }
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("PadKite_v${output.versionName.get()}_${variant.buildType}.apk")
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}

// 服务端 APK 由 :server:copyRelease 拷入 res/raw/easycontrol_server.jar。
// 让 copyRelease 先于 preBuild 执行：preBuild 是各类资源/编译任务的共同上游，
// 所有消费 res 目录的任务都会晚于 copyRelease，满足 Gradle 9 的显式依赖校验
tasks.named("preBuild").configure {
    dependsOn project(":server").tasks.named("copyRelease")
}
